<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Book Template</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/book.css">
</head>
<body>
    <div class="ambient-background"></div>
    
    <div class="scene" id="scene">
        <div class="book" id="book">
            <!-- Book Cover -->
            <div class="book-cover front-cover" id="front-cover">
                <div class="cover-face front">
                    <div class="cover-design">
                        <h1 class="book-title">Title Here</h1>
                        <p class="book-author">Subtitle / Author</p>
                    </div>
                </div>
                <div class="cover-face back inside-cover">
                    <div class="page-content center-content left-page-content">
                        <!-- Left inside cover content goes here -->
                    </div>
                </div>
            </div>

            <!-- Pages -->
            <div class="pages" id="pages-container">
                <!-- Page 1 (Spread 1 Right) -->
                <div class="page" data-page="1">
                    <div class="page-face front">
                        <div class="page-content right-page-content">
                            <!-- Page Content Here -->
                            <span class="page-number-center">1</span>
                        </div>
                        <div class="page-shadow"></div>
                    </div>
                    <div class="page-face back">
                        <div class="page-content left-page-content">
                            <!-- Page Content Here -->
                            <span class="page-number-center">2</span>
                        </div>
                        <div class="page-shadow"></div>
                    </div>
                </div>
                
                <!-- Page 2 (Spread 2 Right) -->
                <div class="page" data-page="2">
                    <div class="page-face front">
                        <div class="page-content right-page-content">
                            <!-- Page Content Here -->
                            <span class="page-number-center">3</span>
                        </div>
                        <div class="page-shadow"></div>
                    </div>
                    <div class="page-face back">
                        <div class="page-content left-page-content">
                            <!-- Page Content Here -->
                            <span class="page-number-center">4</span>
                        </div>
                        <div class="page-shadow"></div>
                    </div>
                </div>

                <!-- Page 3 (Spread 3 Right) -->
                <div class="page" data-page="3">
                    <div class="page-face front">
                        <div class="page-content right-page-content">
                            <!-- Page Content Here -->
                            <span class="page-number-center">5</span>
                        </div>
                        <div class="page-shadow"></div>
                    </div>
                    <div class="page-face back">
                        <div class="page-content left-page-content">
                            <!-- Page Content Here -->
                            <span class="page-number-center">6</span>
                        </div>
                        <div class="page-shadow"></div>
                    </div>
                </div>

                <!-- Page 4 (Spread 4 Right) -->
                <div class="page" data-page="4">
                    <div class="page-face front">
                        <div class="page-content right-page-content">
                            <!-- Page Content Here -->
                            <span class="page-number-center">7</span>
                        </div>
                        <div class="page-shadow"></div>
                    </div>
                    <div class="page-face back">
                        <div class="page-content left-page-content">
                            <!-- Page Content Here -->
                            <span class="page-number-center">8</span>
                        </div>
                        <div class="page-shadow"></div>
                    </div>
                </div>
                
                <!-- Page 5 (Spread 5 Right) -->
                <div class="page" data-page="5">
                    <div class="page-face front">
                        <div class="page-content right-page-content">
                            <!-- Page Content Here -->
                            <span class="page-number-center">9</span>
                        </div>
                        <div class="page-shadow"></div>
                    </div>
                    <div class="page-face back">
                        <div class="page-content left-page-content">
                            <!-- Page Content Here -->
                            <span class="page-number-center">10</span>
                        </div>
                        <div class="page-shadow"></div>
                    </div>
                </div>
            </div>

            <!-- Back Cover -->
            <div class="book-cover back-cover" id="back-cover">
                <div class="cover-face front inside-cover">
                    <!-- Right inside cover content goes here -->
                </div>
                <div class="cover-face back">
                    <div class="cover-design"></div>
                </div>
                <!-- Spine -->
                <div class="spine"></div>
            </div>
        </div>
    </div>

    <!-- UI Controls -->
    <div class="ui-controls">
        <button id="btn-prev" class="nav-btn" aria-label="Previous Page">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button id="btn-next" class="nav-btn" aria-label="Next Page">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
    </div>

    <script src="js/physics.js"></script>
    <script src="js/book.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
